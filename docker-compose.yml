# docker-compose.yml — Optional local Supabase (for offline dev / testing)
# For cloud-native setup, skip this — use Supabase Cloud free tier instead.
# Run: docker-compose up -d

version: "3.8"

services:
  db:
    image: supabase/postgres:15.1.1.61
    container_name: nla-supabase-db
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rest:
    image: supabase/postgrest:v12.0.1
    container_name: nla-supabase-rest
    ports:
      - "54323:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: your-jwt-secret-min-32-chars-long-here
    depends_on:
      db:
        condition: service_healthy

  auth:
    image: supabase/gotrue:v2.143.0
    container_name: nla-supabase-auth
    ports:
      - "54324:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54324
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?search_path=auth
      GOTRUE_JWT_SECRET: your-jwt-secret-min-32-chars-long-here
      GOTRUE_JWT_EXP: 3600
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_AUTOCONFIRM: "true"
    depends_on:
      db:
        condition: service_healthy

  storage:
    image: supabase/storage-api:v1.0.0
    container_name: nla-supabase-storage
    ports:
      - "54325:5000"
    environment:
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzE2MjM5MDIyLCJleHAiOjE4NzQwMDU4MjJ9.qDxTi1r0W3wF9vI3jU5r7vQ1mL0nO8pZ6xV4bN2cM1Y
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3MTYyMzkwMjIsImV4cCI6MTg3NDAwNTgyfQ.dc_X5iJCRqRmvu7871Gz1aRmh1xj3v4jU7sL9n2mK0o
      POSTGRES_URL: postgres://postgres:postgres@db:5432/postgres
      PGOPTIONS: search_path=storage
      REGION: us-east-1
      GLOBAL_S3_BUCKET: nla-storage
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    depends_on:
      db:
        condition: service_healthy

  studio:
    image: supabase/studio:20240325-6388996
    container_name: nla-supabase-studio
    ports:
      - "54321:3000"
    environment:
      SUPABASE_URL: http://rest:3000
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzE2MjM5MDIyLCJleHAiOjE4NzQwMDU4MjJ9.qDxTi1r0W3wF9vI3jU5r7vQ1mL0nO8pZ6xV4bN2cM1Y
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3MTYyMzkwMjIsImV4cCI6MTg3NDAwNTgyfQ.dc_X5iJCRqRmvu7871Gz1aRmh1xj3v4jU7sL9n2mK0o
      NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  storage-data:
